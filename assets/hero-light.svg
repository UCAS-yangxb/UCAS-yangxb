<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Xiaobing Yang — Ph.D. student at the Institute of Automation, CAS</title>
  <desc id="desc">A research-focused introduction connecting reinforcement learning, LLM agents, evolutionary computation, and AI for Science.</desc>

